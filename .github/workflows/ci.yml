name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  ui-and-memory:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Drive the app through every feature
        run: xvfb-run -a node scripts/ui-tour.mjs ui-tour
      - name: Measure memory
        run: xvfb-run -a node dist/ram-benchmark.js --app --seconds 30 --warmup 15 --label ci-ubuntu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-tour-and-memory
          path: |
            ui-tour/
            bench-results/

  # The VS Code fork's built-in extensions, also installable in stock VS Code as .vsix files.
  extensions:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # The agents bundle imports the app's ACP core from src/, which resolves the root packages.
      - run: npm ci && mkdir vsix
      - name: Agents extension
        working-directory: code/extensions/friedliver-agents
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npx -y @vscode/vsce@3.6.0 package --no-dependencies --allow-missing-repository --skip-license -o ../../../vsix/friedliver-agents.vsix
      - name: Theme extension
        working-directory: code/extensions/friedliver-theme
        run: |
          node scripts/generate-themes.mjs --check
          npx -y @vscode/vsce@3.6.0 package --no-dependencies --allow-missing-repository --skip-license -o ../../../vsix/friedliver-theme.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: friedliver-vscode-extensions
          path: vsix/*.vsix
          if-no-files-found: error

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Unsigned until there's a signing certificate.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: friedliver-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
