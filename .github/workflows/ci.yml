name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  ui-and-memory:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Drive the app through the demo tour
        run: xvfb-run -a node scripts/ui-tour.mjs ui-tour
      - name: Measure memory
        run: xvfb-run -a node dist/ram-benchmark.js --app --seconds 30 --warmup 15 --label ci-ubuntu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-tour-and-memory
          path: |
            ui-tour/
            bench-results/
